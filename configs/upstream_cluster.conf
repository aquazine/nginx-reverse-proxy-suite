upstream backend_nodes {
    least_conn;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name lb.local;

    location / {
        proxy_pass http://backend_nodes;
        include proxy_params.conf;
    }
}
